<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brake Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Reuse same sidebar + styling from index.html */
        :root { --bg: #06090f; --surface: #0d1525; --border: rgba(52,152,219,0.3); --text: #c8d6ef; --blue: #3ba7ff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Barlow Condensed', sans-serif; background: var(--bg); color: var(--text); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:#0a101f; border-right:1px solid var(--border); padding:30px 20px; position:fixed; height:100vh; }
        .nav-link { display:block; padding:14px 20px; color:var(--text); text-decoration:none; border-radius:6px; margin-bottom:8px; }
        .nav-link:hover, .nav-link.active { background:rgba(59,167,255,0.15); color:#fff; }
        .main-content { margin-left:260px; padding:40px; flex:1; }
        input, button { padding:10px; margin:5px; border-radius:6px; }
        button { background:#3ba7ff; color:#000; border:none; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Brake Lab</h2>
        <a href="index.html" class="nav-link">🏠 Home & Formulae</a>
        <a href="calculator.html" class="nav-link active">📊 Calculator</a>
        <a href="simulation.html" class="nav-link">🏎️ Simulation</a>
    </div>

    <div class="main-content">
        <h1>Brake Performance Calculator</h1>
        
        <div style="background:#111d33;padding:20px;border-radius:8px;max-width:700px;">
            <label>Vehicle Mass (kg): <input type="number" id="mass" value="245"></label><br>
            <label>Initial Speed (km/h): <input type="number" id="speed" value="90"></label><br>
            <label>Stop Time (s): <input type="number" id="time" value="3.5"></label><br>
            <label>Front Bias (%): <input type="number" id="bias" value="75"></label><br>
            <label>Rotational Factor k: <input type="number" id="k" value="1.15" step="0.05"></label><br><br>
            <button onclick="calculate()">Calculate</button>
        </div>

        <div id="results" style="margin-top:30px;"></div>
        <canvas id="tempChart" style="max-height:300px;margin-top:30px;"></canvas>
        <button onclick="downloadExcel()" style="margin-top:20px;">📥 Download Excel</button>
    </div>

    <script>
        let chart;
        function calculate() {
            const m = parseFloat(document.getElementById('mass').value);
            const v_kmh = parseFloat(document.getElementById('speed').value);
            const t = parseFloat(document.getElementById('time').value);
            const bias = parseFloat(document.getElementById('bias').value)/100;
            const k = parseFloat(document.getElementById('k').value);

            const v = v_kmh / 3.6;
            const KE = 0.5 * m * v*v * k;
            const E_front = KE * bias;
            const E_rear = KE * (1-bias);
            const P_front = E_front / t;
            const deltaT_front = E_front / (1.0 * 460); // approx 1kg rotor, cp=460

            document.getElementById('results').innerHTML = `
                <h2>Results</h2>
                <p><strong>Total KE:</strong> ${(KE/1000).toFixed(1)} kJ</p>
                <p><strong>Front Energy:</strong> ${(E_front/1000).toFixed(1)} kJ | Rear: ${(E_rear/1000).toFixed(1)} kJ</p>
                <p><strong>Front Power:</strong> ${P_front.toFixed(0)} W</p>
                <p><strong>Est. Front Rotor ΔT:</strong> ${deltaT_front.toFixed(1)} °C</p>
            `;

            // Simple chart
            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('tempChart'), {
                type: 'line',
                data: {
                    labels: Array.from({length: 20}, (_,i) => (i* t/20).toFixed(1)+'s'),
                    datasets: [{
                        label: 'Front Rotor Temp (°C)',
                        data: Array.from({length: 20}, (_,i) => deltaT_front * (i/19)),
                        borderColor: '#ff3333'
                    }]
                }
            });
        }

        function downloadExcel() {
            const wb = XLSX.utils.book_new();
            const ws_data = [
                ["Parameter", "Value"],
                ["Vehicle Mass (kg)", document.getElementById('mass').value],
                ["Initial Speed (km/h)", document.getElementById('speed').value],
                // ... add more rows
            ];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "Brake Calc");
            XLSX.writeFile(wb, "brake_calculations.xlsx");
        }

        // Auto calculate on load
        window.onload = calculate;
    </script>
</body>
</html>
